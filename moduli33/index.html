<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <form>
        <div class="name-container">
            <lable id="name_lable">Name:</lable>
            <input type="text" id="name">
            <span id="name_error">Please enter a valid name!</span>
        </div>
        <br>

        <div class="age-container">
            <lable id="age_lable">Age:</lable>
            <input type="text" id="Age">
            <span id="Age_error">Please enter a valid age!</span>
        </div>
        <br>

        <div class="city-container">
            <lable id="city_lable">City:</lable>
            <select id="city">
                <option value="" selected></option>
                <option value="Prishtine">Prishtine</option>
                <option value="Prizren">Prizren</option>
                <option value="Gjilan">Gjilan</option>
                <option value="Peja">Peja</option>
            </select>
            <span id="city_error">Please enter a valid City!</span>
        </div>
        <br>
        <button type="sumbit">Send</button>
    </form>
    <script src="main.js"></script>
</body>
</html>
